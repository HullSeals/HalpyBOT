[tool.poetry]
name = "halpybot"
version = "2.0.0-alpha"
license = "GPL-3.0-only"
description = "The Hull Seals IRC Utility bot, built with Pydle."
authors = [
    "David Sangrey <rixxan@hullseals.space>",
    "Rik Overveld <rikoverveld@gmail.com>"
]
readme = "README.md"
repository = "https://github.com/HullSeals/HalpyBOT"

[tool.poetry.dependencies]
python = "3.10"
pydle = {extras = ["sasl"], version = "^1.2.0"}
mysqlclient = "^2.2.4"
numpy = "^1.24.4"
boto3 = "^1.34.76"
aiohttp = "3.14.4"
gitpython = "3.2.1"
requests = "2.33.0"
pyperclip = "^1.8.2"
tqdm = "^4.66.2"
attrs = "^24.2.0"
cattrs = "^23.2.3 "
loguru = "^0.7.0"
pydantic = {extras = ["dotenv"], version = "^2.14.1"}
sqlalchemy = "^2.0.29"
beautifulsoup4 = "^4.12.3"
lxml = "6.1.0"
pendulum = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-httpserver = "^1.0.6"
pytest-asyncio = ">=0.23.6,<1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"
disable = "line-too-long"

[tool.pytest.ini_options]
asyncio_mode = "auto"
