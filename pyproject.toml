[tool.poetry]
name = "halpybot"
version = "2.0.0-alpha"
license = "GPL-3.0-only"
description = "The Hull Seals IRC Utility bot, built with Pydle."
authors = [
    "David Sangrey <rixxan@hullseals.space>",
    "Rik Overveld <rikoverveld@gmail.com>"
]
readme = "README.md"
repository = "https://github.com/HullSeals/HalpyBOT"

[tool.poetry.dependencies]
python = "3.10"
pydle = {extras = ["sasl"], version = "1.2.0"}
mysqlclient = "2.3.0"
numpy = "2.2.6"
boto3 = "1.43.121"
aiohttp = "3.14.5"
gitpython = "3.2.1"
requests = "2.34.2"
pyperclip = "1.11.0"
tqdm = "4.70.1"
attrs = "26.1.0"
cattrs = "26.2.1"
loguru = "0.7.3"
pydantic = {extras = ["dotenv"], version = "2.14.1"}
pydantic-settings = "2.15.0"
sqlalchemy = "2.0.55"
beautifulsoup4 = "4.15.0"
lxml = "6.1.3"
pendulum = "3.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.2.0"
pytest-httpserver = "1.2.0"
pytest-asyncio = "1.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"
disable = "line-too-long"

[tool.pytest.ini_options]
asyncio_mode = "auto"
